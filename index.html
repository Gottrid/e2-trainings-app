<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E2 Training</title>
<meta name="description" content="Trainings-App der E2-Jugend: wöchentliche Einheiten mit animierten Übungen, Trainingsmodus und Hallen-Liga.">
<meta name="theme-color" content="#0B1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="E2 Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top"><div class="top-in" id="topIn"></div></header>

<main class="wrap" id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="Hauptnavigation">
  <div class="tabs-in">
    <a href="#start" data-tab="start">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Training
    </a>
    <a href="#uebungen" data-tab="uebungen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l4 2.9-1.5 4.7h-5L8 10.4z"/><path d="M12 3v4.5M21 10.4l-5 0M17.3 19.3l-2.8-4.2M6.7 19.3l2.8-4.2M3 10.4h5"/></svg>Übungen
    </a>
    <a href="#kader" data-tab="kader">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.6.2 4.3 2 5 5"/></svg>Kader
    </a>
  </div>
</nav>

<!-- Trainingsmodus -->
<div class="tm" id="tm" role="dialog" aria-modal="true" aria-labelledby="tmTitle">
  <div class="tm-in">
    <div class="tm-bar">
      <button class="x" id="tmClose" type="button" aria-label="Trainingsmodus schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="tm-total">Gesamt <b id="tmTotal">0:00</b> / <span id="tmSum">90:00</span></div>
    </div>
    <div class="tm-dots" id="tmDots"></div>
    <div class="tm-head"><span class="cat" id="tmCat"></span><h2 id="tmTitle"></h2></div>
    <div id="tmVisual"></div>
    <div><div class="tm-time" id="tmTime">10:00</div><div class="tm-lbl" id="tmLbl">Restzeit dieser Station</div></div>
    <div class="tm-prog"><i id="tmProg"></i></div>
    <div class="tm-ctrl">
      <button type="button" id="tmPrev"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 5v14L5 12z"/><rect x="17" y="5" width="2.5" height="14"/></svg>Zurück</button>
      <button type="button" id="tmPlay" class="main">Start</button>
      <button type="button" id="tmNext">Weiter</button>
    </div>
    <div class="tm-pts" id="tmPts"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
