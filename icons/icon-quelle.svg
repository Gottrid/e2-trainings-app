<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="32%" cy="24%" r="100%">
      <stop offset="0" stop-color="#25478A"/>
      <stop offset=".5" stop-color="#132651"/>
      <stop offset="1" stop-color="#060C19"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="70%">
      <stop offset=".55" stop-color="#060C19" stop-opacity="0"/>
      <stop offset="1" stop-color="#060C19" stop-opacity=".75"/>
    </radialGradient>
    <radialGradient id="spot" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF7A1A" stop-opacity=".32"/>
      <stop offset="1" stop-color="#FF7A1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sw" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A1A" stop-opacity="0"/>
      <stop offset=".3" stop-color="#FF7A1A" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFC27A"/>
    </linearGradient>
    <linearGradient id="chalk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#F1ECE0"/>
      <stop offset="1" stop-color="#D2CAB6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB46A"/>
      <stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- TRAINING im Hintergrund -->
  <g transform="rotate(-12 256 256)" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="800" font-size="92" letter-spacing="8" text-anchor="middle">
    <text x="230" y="22" fill="#fff" fill-opacity=".07">TRAINING</text>
    <text x="280" y="112" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2.2">TRAINING</text>
    <text x="236" y="202" fill="#fff" fill-opacity=".07">TRAINING</text>
    <text x="270" y="292" fill="none" stroke="#FF7A1A" stroke-opacity=".42" stroke-width="2.2">TRAINING</text>
    <text x="240" y="382" fill="#fff" fill-opacity=".07">TRAINING</text>
    <text x="276" y="472" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2.2">TRAINING</text>
    <text x="236" y="562" fill="#fff" fill-opacity=".07">TRAINING</text>
  </g>

  <!-- Spielfeld -->
  <g fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="5">
    <circle cx="256" cy="256" r="148"/>
    <line x1="256" y1="-10" x2="256" y2="522"/>
    <rect x="-40" y="146" width="104" height="220"/>
    <rect x="448" y="146" width="104" height="220"/>
  </g>
  <circle cx="256" cy="262" r="200" fill="url(#spot)"/>
  <rect width="512" height="512" fill="url(#vig)"/>

  <!-- Laufweg -->
  <path d="M60 300 C 80 250, 96 214, 126 186" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="6" stroke-dasharray="1 14" stroke-linecap="round"/>

  <!-- Taktik-Pfeil -->
  <path d="M120 402 C 190 462, 330 462, 392 372 S 430 190, 402 126" fill="none" stroke="url(#sw)" stroke-width="20" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M372 140 L404 94 L430 148 Z" fill="#FFC27A" filter="url(#glow)"/>

  <!-- E2 -->
  <g filter="url(#shadow)">
    <g fill="url(#chalk)">
      <path d="M146 146 H262 V188 H196 V225 H250 V265 H196 V302 H262 V344 H146 Z"/>
      <path d="M276 198 C276 162 303 142 337 142 C375 142 398 165 398 199 C398 228 383 247 356 270 L333 290 H400 V344 H274 V304 L338 248 C348 238 351 229 351 213 C351 197 345 187 337 187 C326 187 320 195 320 212 H276 Z"/>
    </g>
    <!-- Glanzkante -->
    <path d="M146 146 H262 V156 H146 Z" fill="#fff" opacity=".6"/>
  </g>

  <!-- Ball -->
  <g transform="translate(120 400)" filter="url(#shadow)">
    <circle r="47" fill="#F7F4EC"/>
    <path d="M0 -18 L17 -6 L11 14 L-11 14 L-17 -6 Z" fill="#0B1424"/>
    <path d="M0 -18 V-45 M17 -6 L43 -14 M11 14 L27 37 M-11 14 L-27 37 M-17 -6 L-43 -14" stroke="#0B1424" stroke-width="5" stroke-linecap="round"/>
    <path d="M-30 -36 A47 47 0 0 1 20 -42" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <circle r="47" fill="none" stroke="#0B1424" stroke-width="4"/>
    <!-- Tempo-Striche -->
    <g stroke="#fff" stroke-opacity=".5" stroke-width="5" stroke-linecap="round"><path d="M-74 -10 H-58"/><path d="M-80 8 H-60"/><path d="M-70 26 H-58"/></g>
  </g>

  <!-- Glanz oben -->
  <path d="M0 0 H512 V150 C 380 120, 160 120, 0 170 Z" fill="url(#glare)"/>
</svg>
