<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#22417A"/>
      <stop offset=".55" stop-color="#12234A"/>
      <stop offset="1" stop-color="#070E1C"/>
    </radialGradient>
    <linearGradient id="sw" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A1A" stop-opacity="0"/>
      <stop offset=".35" stop-color="#FF7A1A" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFB25A"/>
    </linearGradient>
    <linearGradient id="chalk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCD6C6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".45"/>
    </filter>
  <clipPath id="rc"><rect width="512" height="512" rx="112"/></clipPath></defs>
  <g clip-path="url(#rc)"><rect width="512" height="512" fill="url(#bg)"/>
  <!-- Spielfeld-Linien -->
  <g fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="6">
    <circle cx="256" cy="256" r="150"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <rect x="-40" y="140" width="110" height="232"/>
    <rect x="442" y="140" width="110" height="232"/>
  </g>
  <!-- Taktik-Pfeil -->
  <path d="M118 402 C 190 462, 330 462, 392 372 S 430 190, 402 126" fill="none" stroke="url(#sw)" stroke-width="20" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M372 140 L404 96 L428 148 Z" fill="#FFB25A" filter="url(#glow)"/>
  <!-- E2 -->
  <g filter="url(#shadow)" fill="url(#chalk)">
    <path d="M150 150 H262 V190 H198 V226 H250 V264 H198 V300 H262 V340 H150 Z"/>
    <path d="M278 198 C278 164 304 146 336 146 C372 146 394 168 394 200 C394 228 380 246 354 268 L330 288 H396 V340 H276 V302 L338 248 C348 238 350 230 350 214 C350 198 344 188 336 188 C326 188 320 196 320 212 H278 Z"/>
  </g>
  <!-- Ball -->
  <g transform="translate(118 400)" filter="url(#shadow)">
    <circle r="46" fill="#F4F1E8"/>
    <path d="M0 -18 L17 -6 L11 14 L-11 14 L-17 -6 Z" fill="#0B1424"/>
    <path d="M0 -18 V-44 M17 -6 L42 -14 M11 14 L26 36 M-11 14 L-26 36 M-17 -6 L-42 -14" stroke="#0B1424" stroke-width="5" stroke-linecap="round"/>
    <circle r="46" fill="none" stroke="#0B1424" stroke-width="4"/>
  </g>
</g></svg>
